repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^compose\.deploy\.yaml$  # compose's own `!reset` tag
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^uv\.lock$  # the spike's pins (mlflow, dbos, …) make the lock large

  - repo: local
    hooks:
      # Run tools from the uv-locked environment so versions match `uv run`.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: check-canary
        name: holdout canary
        entry: uv run mappd data check-canary
        language: system
        pass_filenames: false
        always_run: true
      - id: db-lint
        name: migration lint
        entry: uv run mappd db lint
        language: system
        pass_filenames: false
        always_run: true
