# Technical questions avoid commercial words (invoice, payment, price, delivery, ship, refund,
# warranty, quote); commercial questions contain one. The mock checker relies on it.
knowledge_base:
  - id: kb-101
    part: technical
    topic: malfunction
    title: Sensor shows offline
    body: >-
      Bus sensors (Temperature Sensor T100, Motion Sensor M110): check the bus cable and
      power-cycle the controller. Zigbee sensors (Door Contact D50, Water Leak Sensor W20): replace
      the battery, then re-pair the sensor in the app.
    question: My sensor shows offline in the app, how do I get it back?
    needs: [device]
  - id: kb-102
    part: technical
    topic: how_to
    title: Controller firmware update
    body: Download the firmware from the portal, upload it on the service page, do not cut power.
    question: How do I update the firmware on my controller?
  - id: kb-103
    part: technical
    topic: how_to
    title: Camera night mode
    body: Enable IR in the camera settings and check that the lens is clean.
    question: How do I switch on night mode on my camera?
  - id: kb-104
    part: technical
    topic: how_to
    title: Adding a second app user
    body: In the app, open Site settings, Users, Invite; the invitee needs their own account.
    question: How can I give a colleague access to the app?
  - id: kb-105
    part: technical
    topic: malfunction
    title: Camera image is black
    body: >-
      Dome Camera D2 and Bullet Camera B6: check the PoE light on the switch port and reseat the
      network cable. Dome Camera D4 Night: switch night mode off and on; the IR filter may be
      stuck.
    question: Why is the image from my camera completely black?
    needs: [device]
  - id: kb-106
    part: technical
    topic: malfunction
    title: Recorder storage full
    body: >-
      Network Recorder NVR8: lower the retention days under Storage. Network Recorder NVR16:
      enable overwrite under Recording, Disk policy.
    question: The recorder says storage is full, what should I change?
    needs: [device]
  - id: kb-107
    part: technical
    topic: how_to
    title: Re-pairing a Zigbee device
    body: Hold the device button for 10 seconds until it blinks, then choose Add device in the app.
    question: How do I pair a new Zigbee device with the bridge?
  - id: kb-108
    part: technical
    topic: malfunction
    title: Temperature readings drift
    body: >-
      Temperature Sensor T100: move it away from heat sources and run calibration in the device
      menu. Temperature and Humidity Sensor T200: replace the filter cap; set the offset in the app
      under Device, Offsets.
    question: My temperature sensor shows values that are too high, how do I fix it?
    needs: [device]
  - id: kb-109
    part: technical
    topic: how_to
    title: Setting up alerts
    body: Create a rule under Automations; choose the sensor, a threshold and who gets notified.
    question: How do I get a notification when the CO2 level is high?
  - id: kb-110
    part: technical
    topic: malfunction
    title: Hub keeps restarting
    body: Check that the power supply delivers 24V under load; replace it if it drops below 22V.
    question: My hub restarts every few minutes, what can cause that?
  - id: kb-111
    part: technical
    topic: how_to
    title: Remote access setup
    body: Activate the licence in the portal, then enable Remote access in the hub settings.
    question: How do I reach my hub from outside the building?
  - id: kb-112
    part: technical
    topic: malfunction
    title: Door contact false alarms
    body: Align the magnet within 10 mm of the contact and tighten the mounting screws.
    question: Why does my door contact report open when the door is closed?
  - id: kb-201
    part: commercial
    topic: refund
    title: Refund policy
    body: Unused equipment can be returned within 30 days of delivery; sales handles every refund.
    question: Can I get a refund for equipment I did not use?
  - id: kb-202
    part: commercial
    topic: delivery
    title: Delivery times
    body: Stock items ship within 2 business days; custom cabinets take 3 weeks.
    question: When will my delivery arrive?
    needs: [order]
  - id: kb-203
    part: commercial
    topic: billing
    title: Invoices and payment terms
    body: Invoices are issued on shipment; payment is due within 30 days by bank transfer.
    question: When is payment due for my invoice?
    needs: [order]
  - id: kb-204
    part: commercial
    topic: billing
    title: Invoice copies
    body: Every invoice is available in the portal under Account, Documents, as a PDF.
    question: Where can I download a copy of my invoice?
  - id: kb-205
    part: commercial
    topic: delivery
    title: Changing the delivery address
    body: The address can be changed in the portal until the order ships; after that call logistics.
    question: Can I change the delivery address of my order?
    needs: [order]
  - id: kb-206
    part: commercial
    topic: other
    title: Warranty coverage
    body: Devices carry a 24-month warranty and batteries 12 months, counted from delivery.
    question: How long is the warranty on your devices?
  - id: kb-207
    part: commercial
    topic: billing
    title: Volume prices
    body: Orders above 50 devices get the project price list; ask sales for the current sheet.
    question: Do you have lower prices for large orders?
  - id: kb-208
    part: commercial
    topic: delivery
    title: Shipping options
    body: Standard shipping is free above 500 EUR; express next-day shipping costs 35 EUR.
    question: Which shipping options do you offer?

