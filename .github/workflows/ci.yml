name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every fast check on the runner: pre-commit (lint, format, types, migration lint,
  # canary) and the tests that need no Postgres or stack.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest -m "not pg and not acceptance" -q

  # The app and MLflow images, tagged with the 12-character commit SHA.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          registry="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          sha=$(git rev-parse --short=12 HEAD)
          docker buildx build --push \
            -t "$registry/mappd-app:$sha" \
            --build-arg "MAPPD_APP_VERSION=$sha" \
            --cache-from "type=registry,ref=$registry/mappd-app:cache" \
            --cache-to "type=registry,ref=$registry/mappd-app:cache,mode=max" \
            .
          docker buildx build --push \
            -t "$registry/mappd-mlflow:$sha" \
            --cache-from "type=registry,ref=$registry/mappd-mlflow:cache" \
            --cache-to "type=registry,ref=$registry/mappd-mlflow:cache,mode=max" \
            deploy/mlflow
